<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3ead9" />
  <title>Kayla &amp; Paul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍊</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <h1>Kayla &amp; Paul</h1>
        <p class="tagline">Places we've eaten</p>
      </div>
      <div class="top-actions">
        <button id="manageCuisinesBtn" class="btn btn-ghost" title="Add or remove cuisines">Cuisines</button>
        <button id="addBtn" class="btn btn-accent">Add</button>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <div class="wrap tabs-inner">
      <button id="tabPlaces" class="tab active" type="button">Places</button>
      <button id="tabInsights" class="tab" type="button">Insights</button>
    </div>
  </nav>

  <div class="controls">
    <div class="wrap controls-row">
      <input id="search" class="search" type="search" placeholder="Search" autocomplete="off" />
      <button id="sortDateBtn" class="btn btn-sort" data-active="true">Newest ↓</button>
    </div>
    <div class="wrap tools-row">
      <button id="filterCuisineBtn" class="btn btn-filter">Cuisines</button>
      <button id="filterCityBtn" class="btn btn-filter">Cities</button>
      <span class="tools-spacer"></span>
      <button id="clearFiltersBtn" class="btn btn-link-quiet" hidden>Clear filters</button>
    </div>
    <div class="wrap">
      <div class="list-head">
        <button class="lh lh-name" id="sortName" type="button">Name <span class="arrow"></span></button>
        <button class="lh lh-score" id="sortKayla" type="button">Kayla <span class="arrow"></span></button>
        <button class="lh lh-score" id="sortPaul" type="button">Paul <span class="arrow"></span></button>
      </div>
    </div>
  </div>

  <main id="app" class="wrap app">
    <p class="empty-state" id="loading">Loading…</p>
  </main>

  <section id="insights" class="wrap insights" hidden></section>

  <footer class="wrap footer">
    <span id="statLine"></span>
    <span id="syncBadge" class="sync-badge"></span>
  </footer>

  <!-- Reusable filter dialog (cuisines / cities) -->
  <dialog id="filterDialog" class="sheet">
    <header class="sheet-head">
      <h2 id="filterTitle">Filter</h2>
      <button type="button" class="x" id="closeFilter" aria-label="Close">✕</button>
    </header>
    <div class="pill-grid" id="pillGrid"></div>
    <footer class="sheet-foot">
      <button type="button" class="btn btn-accent" id="filterDone">Done</button>
    </footer>
  </dialog>

  <!-- Manage cuisines dialog -->
  <dialog id="manageDialog" class="sheet">
    <header class="sheet-head">
      <h2>Cuisines</h2>
      <button type="button" class="x" id="closeManage" aria-label="Close">✕</button>
    </header>
    <div class="manage-body">
      <form id="addCuisineForm" class="add-cuisine">
        <input id="newCuisine" placeholder="New cuisine (e.g. Spanish)" maxlength="60" />
        <button type="submit" class="btn btn-accent">Add</button>
      </form>
      <ul id="cuisineMgrList" class="cuisine-mgr"></ul>
    </div>
  </dialog>

  <!-- Detail view -->
  <dialog id="detail" class="sheet">
    <button type="button" class="x sheet-x" id="closeDetail" aria-label="Close">✕</button>
    <div class="sheet-body" id="detailBody"></div>
    <footer class="sheet-foot">
      <a id="detailMap" class="btn btn-accent" target="_blank" rel="noopener">Open in Maps ↗</a>
      <button type="button" class="btn btn-quiet" id="detailEdit">Edit</button>
    </footer>
  </dialog>

  <!-- Add / edit dialog -->
  <dialog id="editor" class="editor">
    <form id="editorForm" method="dialog">
      <header class="editor-head">
        <h2 id="editorTitle">Add a place</h2>
        <button type="button" class="x" id="closeEditor" aria-label="Close">✕</button>
      </header>
      <div class="editor-body">
        <label class="field">
          <span class="field-label">Name</span>
          <input id="f-name" required maxlength="120" placeholder="What's it called?" />
        </label>
        <div class="field-row">
          <label class="field">
            <span class="field-label">Cuisine</span>
            <select id="f-cuisine" class="select"></select>
          </label>
          <label class="field">
            <span class="field-label">City / area</span>
            <input id="f-city" placeholder="Montreal" />
          </label>
        </div>
        <fieldset class="ratings">
          <legend class="field-label">Ratings <span class="muted">/ 10</span></legend>
          <div class="ratings-head">
            <span>Month</span><span>Kayla</span><span>Paul</span><span></span>
          </div>
          <div id="visitsList" class="visits-list"></div>
          <button type="button" class="btn btn-quiet btn-sm" id="addVisitBtn">+ Add another visit</button>
          <p class="hint">Been back? Add another visit with its month so you keep the history.</p>
        </fieldset>
        <label class="field">
          <span class="field-label">Notes</span>
          <textarea id="f-comment" rows="3" maxlength="2000" placeholder="What to order, the vibe…"></textarea>
        </label>
      </div>
      <footer class="editor-foot">
        <button type="button" class="btn btn-link-danger" id="deleteBtn" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-quiet" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-accent" id="saveBtn">Save</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="seed-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
