<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3ead9" />
  <title>Kayla &amp; Paul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍊</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <h1>Kayla &amp; Paul</h1>
        <p class="tagline">Places we've eaten</p>
      </div>
      <button id="addBtn" class="btn btn-accent">Add a place</button>
    </div>
  </header>

  <div class="controls">
    <div class="wrap controls-inner">
      <input id="search" class="search" type="search" placeholder="Search" autocomplete="off" />
      <select id="sortBy" class="sort" aria-label="Sort by">
        <option value="avg-desc">Top rated</option>
        <option value="avg-asc">Lowest rated</option>
        <option value="name-asc">A–Z</option>
        <option value="recent">Newest</option>
      </select>
    </div>
    <div class="wrap">
      <div id="cuisineChips" class="chips" role="tablist" aria-label="Filter by cuisine"></div>
    </div>
  </div>

  <main id="app" class="wrap app">
    <p class="empty-state" id="loading">Loading…</p>
  </main>

  <footer class="wrap footer">
    <span id="statLine"></span>
    <span id="syncBadge" class="sync-badge"></span>
  </footer>

  <!-- Add / edit dialog -->
  <dialog id="editor" class="editor">
    <form id="editorForm" method="dialog">
      <header class="editor-head">
        <h2 id="editorTitle">Add a place</h2>
        <button type="button" class="x" id="closeEditor" aria-label="Close">✕</button>
      </header>

      <div class="editor-body">
        <label class="field">
          <span class="field-label">Name</span>
          <input id="f-name" required maxlength="120" placeholder="What's it called?" />
        </label>

        <div class="field-row">
          <label class="field">
            <span class="field-label">Type of food</span>
            <input id="f-cuisine" list="cuisineList" placeholder="e.g. Japanese" />
            <datalist id="cuisineList"></datalist>
          </label>
          <label class="field">
            <span class="field-label">City / area</span>
            <input id="f-city" placeholder="Montreal" />
          </label>
        </div>

        <fieldset class="ratings">
          <legend class="field-label">Ratings <span class="muted">/ 10</span></legend>
          <div class="ratings-head">
            <span></span><span>Kayla</span><span>Paul</span><span></span>
          </div>
          <div id="visitsList" class="visits-list"></div>
          <button type="button" class="btn btn-quiet btn-sm" id="addVisitBtn">+ Add another visit</button>
          <p class="hint">Been back? Add a new visit (with a year) to keep the old score too.</p>
        </fieldset>

        <label class="field">
          <span class="field-label">Notes</span>
          <textarea id="f-comment" rows="3" maxlength="2000" placeholder="What to order, the vibe…"></textarea>
        </label>
      </div>

      <footer class="editor-foot">
        <button type="button" class="btn btn-link-danger" id="deleteBtn" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-quiet" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-accent" id="saveBtn">Save</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="seed-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
