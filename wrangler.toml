name = "restaurantapp"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Static site (index.html, app.js, styles.css, seed-data.js) is served from /public.
# The Worker only handles /api/* requests; everything else is an asset.
[assets]
directory = "./public"
binding = "ASSETS"

# --- Cloud data storage: synced across devices via Cloudflare D1 -------------
# The table is created and seeded automatically on first load.
[[d1_databases]]
binding = "DB"
database_name = "kp-restaurants"
database_id = "d6dc8ffa-5bae-4aa2-a7f0-169f39dd129a"
