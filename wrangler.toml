name = "kp-restaurants"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Static site (index.html, app.js, styles.css, seed-data.js) is served from /public.
# The Worker only handles /api/* requests; everything else is an asset.
[assets]
directory = "./public"
binding = "ASSETS"

# --- Cloud data storage (optional, enables cross-device sync) ---------------
# Until this is set up, the app still works and saves data in each browser.
# To turn on Cloudflare-hosted data:
#   1. Dashboard -> Storage & Databases -> D1 -> Create database "kp-restaurants"
#      (copy the Database ID it shows you).
#   2. Uncomment the block below and paste the ID.
#   3. Commit/push (or redeploy) — the table seeds itself on first load.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "kp-restaurants"
# database_id = "PASTE_YOUR_DATABASE_ID_HERE"
